<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spider 校验 HTML 报告</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f1;
      --panel: #ffffff;
      --text: #102027;
      --muted: #57707d;
      --accent: #0f766e;
      --accent-soft: #d7f3ee;
      --danger: #b42318;
      --danger-soft: #fde7e4;
      --border: #d8e3df;
      --shadow: 0 16px 40px rgba(16, 32, 39, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 28%),
        linear-gradient(180deg, #f7faf9 0%, var(--bg) 100%);
      color: var(--text);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .page {
      width: min(1600px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .hero {
      display: grid;
      gap: 18px;
      margin-bottom: 18px;
      padding: 24px;
      border: 1px solid rgba(15, 118, 110, 0.16);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(231, 245, 241, 0.96));
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .summary-card {
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.84);
    }

    .summary-card span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .summary-card strong {
      font-size: 24px;
      letter-spacing: -0.03em;
    }

    .panel {
      margin-top: 18px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .filter {
      display: grid;
      gap: 6px;
    }

    .filter label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .filter input,
    .filter select,
    .filter button {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .filter button {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }

    .filter button:hover {
      filter: brightness(0.97);
    }

    #summary-line {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    table {
      width: 100%;
      min-width: 1300px;
      border-collapse: collapse;
      background: #fff;
    }

    thead {
      background: #f4faf8;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      text-align: left;
      font-size: 13px;
    }

    td {
      line-height: 1.45;
      word-break: break-word;
    }

    th button {
      all: unset;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 700;
      color: var(--text);
    }

    th button .sort-indicator {
      color: var(--muted);
      font-size: 11px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
    }

    .status.success {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .status.failed {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .empty {
      padding: 28px 14px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .page {
        width: min(100vw - 20px, 1600px);
        padding-top: 16px;
      }

      .hero,
      .panel {
        padding: 16px;
        border-radius: 16px;
      }
    }
  </style>
</head>

  <div class="page">
    <section class="hero">

    <section class="panel">

      <div class="filters">
        <div class="filter">

          <select id="status-filter"></select>

        <div class="filter">

        <div class="filter">

          <input id="duration-max-filter" type="number" min="0" />
        </div>
        <div class="filter">
          <label for="reset-filters">操作</label>
          <button id="reset-filters" type="button">重置筛选</button>
        </div>
      </div>
      <p id="summary-line">当前显示 0 / 0 条</p>
    </section>

      </div>
    </section>

            <td>${escapeHtml(formatDuration(item.timings_ms?.home ?? 0))}</td>
            <td>${escapeHtml(formatDuration(item.timings_ms?.category ?? 0))}</td>
            <td>${escapeHtml(formatDuration(item.timings_ms?.detail ?? 0))}</td>
            <td>${escapeHtml(formatDuration(item.timings_ms?.player ?? 0))}</td>
            <td>${escapeHtml(formatDuration(item.timings_ms?.url_check ?? 0))}</td>
            <td>${escapeHtml(item.player?.url ?? "")}</td>
            <td>${escapeHtml(item.error ?? "")}</td>
          </tr>
        `;
      }).join("");
    }

    function updateSortIndicators() {
      document.querySelectorAll("[data-sort-key]").forEach((button) => {
        const indicator = button.querySelector(".sort-indicator");
        if (!indicator) {
          return;
        }
        if (button.dataset.sortKey !== state.sortKey) {
          indicator.textContent = "";
          return;
        }
        indicator.textContent = state.sortDirection === "asc" ? "▲" : "▼";
      });
    }

    function rerender() {
      const filtered = applyFilters(report.results);
      const sorted = applySort(filtered);
      renderSummary(sorted);
      renderRows(sorted);
      updateSortIndicators();
    }

    function initializeFilters() {
      const statusFilter = document.getElementById("status-filter");
      const stageFilter = document.getElementById("stage-filter");
      const keywordFilter = document.getElementById("keyword-filter");
      const minFilter = document.getElementById("duration-min-filter");
      const maxFilter = document.getElementById("duration-max-filter");
      const resetButton = document.getElementById("reset-filters");

      statusFilter.innerHTML = [
        '<option value="all">全部状态</option>',
        '<option value="success">成功</option>',
        '<option value="failed">失败</option>',
      ].join("");

      stageFilter.innerHTML = ['<option value="all">全部阶段</option>']
        .concat(uniqueFailedStages(report.results).map((stage) => `<option value="${escapeHtml(stage)}">${escapeHtml(stageLabel(stage))}</option>`))
        .join("");

      statusFilter.addEventListener("change", (event) => {
        state.status = event.target.value;
        rerender();
      });
      stageFilter.addEventListener("change", (event) => {
        state.failedStage = event.target.value;
        rerender();
      });
      keywordFilter.addEventListener("input", (event) => {
        state.keyword = event.target.value.trim();
        rerender();
      });
      minFilter.addEventListener("input", (event) => {
        state.minDuration = event.target.value;
        rerender();
      });
      maxFilter.addEventListener("input", (event) => {
        state.maxDuration = event.target.value;
        rerender();
      });
      resetButton.addEventListener("click", () => {
        state.status = "all";
        state.failedStage = "all";
        state.keyword = "";
        state.minDuration = "";
        state.maxDuration = "";
        statusFilter.value = "all";
        stageFilter.value = "all";
        keywordFilter.value = "";
        minFilter.value = "";
        maxFilter.value = "";
        rerender();
      });

      document.querySelectorAll("[data-sort-key]").forEach((button) => {
        button.addEventListener("click", () => {
          const key = button.dataset.sortKey;
          if (state.sortKey === key) {
            state.sortDirection = state.sortDirection === "asc" ? "desc" : "asc";
          } else {
            state.sortKey = key;
            state.sortDirection = "asc";
          }
          rerender();
        });
      });
    }

    function initializeSummaryCards() {
      document.getElementById("generated-at").textContent = report.generated_at || "";
      document.getElementById("max-workers").textContent = String(report.max_workers ?? "");
      document.getElementById("total-count").textContent = String(report.summary?.total ?? 0);
      document.getElementById("success-count").textContent = String(report.summary?.success ?? 0);
      document.getElementById("failed-count").textContent = String(report.summary?.failed ?? 0);
      document.getElementById("total-duration").textContent = formatDuration(report.total_duration_ms ?? 0);
    }

    initializeSummaryCards();
    initializeFilters();
    rerender();
  </script>
</body>
</html>
