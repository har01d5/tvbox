<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spider 校验 HTML 报告</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f1;
      --panel: #ffffff;
      --text: #102027;
      --muted: #57707d;
      --accent: #0f766e;
      --accent-soft: #d7f3ee;
      --danger: #b42318;
      --danger-soft: #fde7e4;
      --border: #d8e3df;
      --shadow: 0 16px 40px rgba(16, 32, 39, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 28%),
        linear-gradient(180deg, #f7faf9 0%, var(--bg) 100%);
      color: var(--text);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .page {
      width: min(1600px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .hero {
      display: grid;
      gap: 18px;
      margin-bottom: 18px;
      padding: 24px;
      border: 1px solid rgba(15, 118, 110, 0.16);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(231, 245, 241, 0.96));
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .summary-card {
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.84);
    }

    .summary-card span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .summary-card strong {
      font-size: 24px;
      letter-spacing: -0.03em;
    }

    .panel {
      margin-top: 18px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .filter {
      display: grid;
      gap: 6px;
    }

    .filter label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .filter input,
    .filter select,
    .filter button {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .filter button {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }

    .filter button:hover {
      filter: brightness(0.97);
    }

    #summary-line {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    table {
      width: 100%;
      min-width: 1300px;
      border-collapse: collapse;
      background: #fff;
    }

    thead {
      background: #f4faf8;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      text-align: left;
      font-size: 13px;
    }

    td {
      line-height: 1.45;
      word-break: break-word;
    }

    th button {
      all: unset;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 700;
      color: var(--text);
    }

    th button .sort-indicator {
      color: var(--muted);
      font-size: 11px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
    }

    .status.success {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .status.failed {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .empty {
      padding: 28px 14px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .page {
        width: min(100vw - 20px, 1600px);
        padding-top: 16px;
      }

      .hero,
      .panel {
        padding: 16px;
        border-radius: 16px;
      }
    }
  </style>
</head>

  <div class="page">
    <section class="hero">

      <div class="summary-grid">

    <section class="panel">

      <div class="filters">
        <div class="filter">
          <label for="status-filter">状态</label>
          <select id="status-filter"></select>

        <div class="filter">

          <select id="stage-filter"></select>

        <div class="filter">
          <label for="duration-min-filter">最小耗时(ms)</label>
          <input id="duration-min-filter" type="number" min="0" />
        </div>
        <div class="filter">
          <label for="duration-max-filter">最大耗时(ms)</label>
          <input id="duration-max-filter" type="number" min="0" />
        </div>
        <div class="filter">
          <label for="reset-filters">操作</label>
          <button id="reset-filters" type="button">重置筛选</button>
        </div>
      </div>
      <p id="summary-line">当前显示 0 / 0 条</p>
    </section>

            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatDuration(value) {
      const numeric = Number(value ?? 0);
      if (Number.isNaN(numeric)) {
        return String(value ?? "");
      }
      if (numeric >= 1000) {
        return `${Math.round((numeric / 1000) * 1000) / 1000}秒`;
      }
      return `${numeric}ms`;
    }

    function stageLabel(stage) {
      return stage ? (STAGE_LABELS[stage] || stage) : "";
    }

    function spiderUrl(fileName) {
      return SPIDER_RELATIVE_PREFIX + encodeURIComponent(String(fileName || ""));
    }

    function uniqueFailedStages(items) {
      const values = new Set();
      items.forEach((item) => {
        if (item.failed_stage) {
          values.add(item.failed_stage);
        }
      });
      return [...values].sort((left, right) => stageLabel(left).localeCompare(stageLabel(right), "zh-Hans-CN"));
    }

    function sortValue(item, key) {
      if (key === "status") {
        return item.success ? 0 : 1;
      }
      if (key === "failed_stage") {
        return stageLabel(item.failed_stage);
      }
      if (key === "spider") {
        return item.spider || "";
      }
      return Number(item.timings_ms?.[key] ?? 0);
    }

    function applyFilters(items) {
      return items.filter((item) => {
        if (state.status === "success" && !item.success) {
          return false;
        }
        if (state.status === "failed" && item.success) {
          return false;
        }
        if (state.failedStage !== "all" && (item.failed_stage || "") !== state.failedStage) {
          return false;
        }
        const haystack = `${item.spider || ""} ${item.file || ""}`.toLowerCase();
        if (state.keyword && !haystack.includes(state.keyword.toLowerCase())) {
          return false;
        }
        const total = Number(item.timings_ms?.total ?? 0);
        if (state.minDuration !== "" && total < Number(state.minDuration)) {
          return false;
        }
        if (state.maxDuration !== "" && total > Number(state.maxDuration)) {
          return false;
        }
        return true;
      });
    }

    function applySort(items) {
      return [...items].sort((left, right) => {
        const a = sortValue(left, state.sortKey);
        const b = sortValue(right, state.sortKey);
        const comparison = typeof a === "number" && typeof b === "number"
          ? a - b
          : String(a).localeCompare(String(b), "zh-Hans-CN");
        return state.sortDirection === "asc" ? comparison : -comparison;

    }

    function renderSummary(items) {

    function updateSortIndicators() {

    function initializeFilters() {
